services:
  - type: web
    name: aqd-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: aqd_production
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: WARNING
      - key: PYTHON_VERSION
        value: 3.11.0
